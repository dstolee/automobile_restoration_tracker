[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automobile-restoration-tracker"
version = "0.1.0"
description = "A self-hosted Flask application for planning and documenting automobile restoration projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Automobile Restoration Tracker contributors" }]
keywords = ["automobile", "restoration", "flask", "self-hosted", "project-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "Pillow>=11,<12",
  "gunicorn>=23,<27",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "pip-audit>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/automobile-restoration-tracker"
Issues = "https://github.com/YOUR-GITHUB-USERNAME/automobile-restoration-tracker/issues"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["instance", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
